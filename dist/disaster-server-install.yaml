# Source: disaster-server/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: disaster-system
  name: disaster-server
  labels:
    helm.sh/chart: disaster-server-0.1.0
    app.kubernetes.io/name: disaster-server
    app.kubernetes.io/instance: disaster-server
    app.kubernetes.io/version: 0.0.1
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: disaster-server
      app.kubernetes.io/instance: disaster-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: disaster-server
        app.kubernetes.io/instance: disaster-server
      annotations:
        {}
    spec:
      serviceAccountName: disaster-server
      imagePullSecrets:
        - name: default-secret
      containers:
        - name: disaster-server
          env:
            - name: TZ
              value: Asia/Shanghai
          image: "swr.cn-east-3.myhuaweicloud.com/chenmou/disaster-server:v1.0.0-arm64"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/configs/config.yaml
              subPath: config.yaml
          resources:
            {}
      volumes:
        - name: config
          configMap:
            name: disaster-server
      nodeSelector:
        {}
      affinity:
        {}
      tolerations:
        []
