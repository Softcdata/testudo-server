replicaCount: 1

image:
  repository: ghcr.io/liangzai006/disaster-server
  tag: "latest"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

resources:
  {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

configs:
  configYaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      namespace: disaster-system
    log:
      level: debug
    jwt:
      secret: "change-me-generate-a-strong-secret"
      timeout: 24h
      access_expire: 24h
      refresh_expire: 168h
    swagger:
      enabled: false
    license:
      enabled: true
      namespace: ""
      caPath: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: "disaster.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: disaster-server-tls
  #   hosts:
  #     - disaster.example.com
