{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "disaster-server.serviceAccountName" . }}
  labels:
    {{- include "disaster-server.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end }}
---
{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "disaster-server.serviceAccountName" . }}
  labels:
    {{- include "disaster-server.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.serviceAccount.annotations | nindent 4 }}
{{- end }}
subjects:
  - kind: ServiceAccount
    name: {{ include "disaster-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "disaster-server.serviceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
---
{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "disaster-server.serviceAccountName" . }}
  labels:
    {{- include "disaster-server.labels" . | nindent 4 }}
{{- end }}
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---